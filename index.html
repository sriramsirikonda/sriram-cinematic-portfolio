-size:8px}.section-head span:last-child{display:none}.work-card{margin-bottom:10vh}.work-image{height:58vh}.work-meta{grid-template-columns:1fr;gap:10px}.work-meta h2{font-size:36px}.about-layout{grid-template-columns:1fr;gap:6vh}.about-big{font-size:16vw}.about-copy p{font-size:15px}.experience-card{grid-template-columns:1fr;gap:4vh}.experience-card h2{font-size:60px}.skills-list div{grid-template-columns:45px 1fr;font-size:27px}.contact-title{font-size:18vw;margin:5vh 0 9vh}.contact-grid{grid-template-columns:1fr}.contact-grid>div:nth-child(even){padding-left:0;border-left:none}.contact-grid>div:nth-child(odd){padding-right:0}footer{padding:22px 6vw;flex-direction:column;gap:12px;font-size:8px}}

const A = "";

function Preloader({ done }) {
  const ref = useRef(null);
  useEffect(() => {
    const tl = gsap.timeline({
      onComplete: done,
    });
    tl.fromTo(".loader-mark", { scaleX: 0, transformOrigin: "left" }, { scaleX: 1, duration: 1.1, ease: "power4.inOut" })
      .fromTo(".loader-name", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .8, ease: "power3.out" }, "-=.45")
      .to(ref.current, { clipPath: "inset(0 0 100% 0)", duration: 1, ease: "power4.inOut", delay: .35 });
    return () => tl.kill();
  }, [done]);
  return <div ref={ref} className="preloader">
    <div className="loader-inner">
      <div className="loader-kicker">CIVIL / BIM / 2026</div>
      <div className="loader-mark" />
      <div className="loader-name">SRIRAM</div>
    </div>
  </div>;
}

function Cursor() {
  const dot = useRef(null), ring = useRef(null);
  useEffect(() => {
    const x1 = gsap.quickTo(dot.current, "x", {duration:.08}), y1 = gsap.quickTo(dot.current, "y", {duration:.08});
    const x2 = gsap.quickTo(ring.current, "x", {duration:.22, ease:"power3.out"}), y2 = gsap.quickTo(ring.current, "y", {duration:.22, ease:"power3.out"});
    const move = e => { x1(e.clientX-3); y1(e.clientY-3); x2(e.clientX-18); y2(e.clientY-18); };
    window.addEventListener("mousemove", move);
    return () => window.removeEventListener("mousemove", move);
  }, []);
  return <><div className="cursor-dot" ref={dot}/><div className="cursor-ring" ref={ring}/></>;
}

const projects = [
  ["01", "ARCHITECTURE", "render image(1).png", "G+5 Residential Apartment Building", "Revit Architecture course-completion project."],
  ["02", "PLAN", "Screenshot 2026-09-10 005154.png", "Floor Plan", "Architectural planning study."],
  ["03", "ELEVATION", "Elevation-1.png", "Elevation Studies", "Project elevation sheets."],
  ["04", "STRUCTURAL BIM", "Screenshot 2026-09-10 003444.png", "Structural BIM", "3D structural model study."],
  ["05", "REINFORCEMENT", "Screenshot 2026-09-10 010048.png", "Reinforcement", "Reinforcement modelling study."],
  ["06", "EXCAVATION", "Screenshot 2026-09-10 010152.png", "Excavation", "Excavation plan study."],
  ["07", "DETAILING", "Detailing-1.png", "Structural Detailing", "Structural detailing sheet."],
];

function Header() {
  return <header className="nav">
    <a className="brand" href="#home">SRIRAM<span>.</span></a>
    <nav>
      <a href="#work">WORK</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a>
    </nav>
    <div className="nav-index">SCROLL TO EXPLORE <span>↓</span></div>
  </header>;
}

function Hero() {
  const section = useRef(null);
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.from(".hero-kicker", {y:30, opacity:0, duration:1, delay:.25});
      gsap.from(".hero-title span", {y:90, opacity:0, duration:1.2, stagger:.08, ease:"power4.out", delay:.3});
      gsap.from(".hero-photo", {scale:1.15, opacity:0, duration:1.6, ease:"power4.out", delay:.45});
      gsap.to(".hero-photo", {yPercent:-10, scale:1.05, ease:"none", scrollTrigger:{trigger:section.current, start:"top top", end:"bottom top", scrub:1}});
      gsap.to(".hero-title", {yPercent:-25, opacity:.2, ease:"none", scrollTrigger:{trigger:section.current, start:"top top", end:"bottom top", scrub:1}});
    }, section);
    return () => ctx.revert();
  }, []);
  return <section id="home" className="hero" ref={section}>
    <div className="hero-grid"/>
    <div className="hero-copy">
      <div className="hero-kicker">CIVIL ENGINEERING GRADUATE / ASPIRING BIM ENGINEER</div>
      <h1 className="hero-title"><span>SIRIKONDA</span><span>SRIRAM</span></h1>
      <p className="hero-note">A visual portfolio of architecture, BIM, structural modelling and detailing.</p>
    </div>
    <div className="hero-photo-wrap"><img className="hero-photo" src={A+"dp.png"} /></div>
    <div className="hero-scroll">01 — IDENTITY</div>
  </section>;
}

function Work() {
  const wrap = useRef(null);
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.utils.toArray(".work-card").forEach((card, i) => {
        const img = card.querySelector("img");
        gsap.fromTo(img, {scale:1.16}, {scale:1, ease:"none", scrollTrigger:{trigger:card, start:"top bottom", end:"bottom top", scrub:1}});
        gsap.from(card.querySelector(".work-meta"), {y:40, opacity:0, duration:.9, scrollTrigger:{trigger:card, start:"top 72%"}});
      });
    }, wrap);
    return () => ctx.revert();
  }, []);
  return <section id="work" className="work" ref={wrap}>
    <div className="section-head"><span>02 / SELECTED WORK</span><span>ACTUAL PROJECT ASSETS</span></div>
    {projects.map(([n, tag, img, title, desc]) =>
      <article className="work-card" key={n}>
        <div className="work-image"><img src={A+img}/><div className="image-number">{n}</div></div>
        <div className="work-meta"><div className="tag">{tag}</div><h2>{title}</h2><p>{desc}</p></div>
      </article>
    )}
  </section>;
}

function About() {
  const ref = useRef(null);
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.from(".about-line", {scaleX:0, transformOrigin:"left", duration:1.2, scrollTrigger:{trigger:ref.current, start:"top 70%"}});
      gsap.from(".about-copy > *", {y:45, opacity:0, stagger:.12, duration:.9, scrollTrigger:{trigger:ref.current, start:"top 65%"}});
    }, ref);
    return () => ctx.revert();
  }, []);
  return <section id="about" className="about" ref={ref}>
    <div className="section-head"><span>03 / ABOUT</span><span>HYDERABAD, TELANGANA</span></div>
    <div className="about-line"/>
    <div className="about-layout">
      <div className="about-big">BUILDING<br/><em>INFORMATION</em><br/>THROUGH <span>DESIGN.</span></div>
      <div className="about-copy">
        <p>I’m Sirikonda Sriram, a Civil Engineering Graduate focused on building a career in BIM and digital construction workflows.</p>
        <p>My portfolio brings together architectural modelling, structural BIM studies, reinforcement, excavation and detailing work.</p>
        <div className="facts"><span>B.TECH / 8.33 CGPA</span><span>BIM TECHNOLOGIES</span><span>REVIT ARCHITECTURE</span><span>REVIT STRUCTURE — IN PROGRESS</span></div>
      </div>
    </div>
  </section>;
}

function Experience() {
  const ref=useRef(null);
  useEffect(()=>{const ctx=gsap.context(()=>gsap.from(".experience-card",{y:70,opacity:0,duration:1,scrollTrigger:{trigger:ref.current,start:"top 70%"}}),ref);return()=>ctx.revert()},[]);
  return <section className="experience" ref={ref}>
    <div className="section-head"><span>04 / EXPERIENCE</span><span>FIELD EXPOSURE</span></div>
    <div className="experience-card">
      <div className="exp-year">FEB — APR<br/>2026</div>
      <div><div className="tag">HMDA / DIVISION-I</div><h2>Site Intern</h2><p>Hyderabad Metropolitan Development Authority (HMDA), Hyderabad.</p><p>Exposure to construction execution, structural execution, quality control and site management on a motorable bridge construction project.</p></div>
    </div>
  </section>;
}

function Skills() {
  return <section className="skills">
    <div className="section-head"><span>05 / TOOLKIT</span><span>FAMILIAR WITH</span></div>
    <div className="skills-list">
      {["Revit Architecture","Revit Structure","AutoCAD Civil","AutoCAD Architecture","Civil 3D","QGIS","STAAD.Pro","MS Word","Excel","PowerPoint"].map((s,i)=><div key={s}><b>{String(i+1).padStart(2,"0")}</b><span>{s}</span></div>)}

function Contact() {
  return <section id="contact" className="contact">
    <div className="section-head"><span>06 / CONTACT</span><span>LET'S CONNECT</span></div>
    <div className="contact-title">LET'S BUILD<br/><em>WHAT'S NEXT.</em></div>
    <div className="contact-grid">
      <div><span>EMAIL</span><a href="mailto:sriramsirikonda119@gmail.com">sriramsirikonda119@gmail.com</a></div>
      <div><span>PHONE</span><a href="tel:9392934742">+91 9392934742</a></div>
      <div><span>LINKEDIN</span><a href="https://www.linkedin.com/in/sriram-sirikonda-16633833b" target="_blank" rel="noreferrer">linkedin.com/in/sriram-sirikonda</a></div>
      <div><span>LOCATION</span><p>Hyderabad, Telangana</p></div>
    </div>
  </section>;
}

function App() {
  const [loading,setLoading]=useState(true);
  useEffect(()=>{document.body.classList.toggle("locked",loading); return()=>document.body.classList.remove("locked")},[loading]);
  return <>{loading && <Preloader done={()=>setLoading(false)}/>}<Cursor/><Header/><main><Hero/><Work/><About/><Experience/><Skills/><Contact/></main><footer><span>SRIRAM.</span><span>CIVIL ENGINEERING / BIM / 2026</span><span>© {new Date().getFullYear()} SIRIKONDA SRIRAM</span></footer></>;
}

createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
